<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090a0b">
<meta http-equiv="Cache-Control" content="no-store">
<title>Stargazer 完整版 · 规则工作区</title>
<link rel="stylesheet" href="/static/stargazer_ui.css">
<link rel="stylesheet" href="/static/stargazer_ui_next.css">
<style>
/* 完整版补充样式（沿用生产版设计变量） */
.main-nav{overflow-x:auto;scrollbar-width:none}
.main-nav::-webkit-scrollbar{display:none}
.main-nav button{flex-shrink:0;white-space:nowrap;padding:0 9px;font-size:12px}
.stat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.cond{display:grid;grid-template-columns:minmax(220px,1fr) 66px 96px 60px minmax(140px,200px) 34px;gap:8px;align-items:center;padding:7px 14px;border-bottom:1px solid #24282b}
.cond select,.cond input{background:#0c0e0f;border:1px solid #343a3e;border-radius:3px;padding:6px 8px;color:#e4e8eb;font-size:11px;min-width:0}
.cond .unit{color:#9aa2a9;font-size:10px}
.cond .hint{color:#777f86;font-size:10px;line-height:1.5}
.logic-line{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#9aa2a9;font-size:11px;flex-wrap:wrap}
.sentence{border-left:3px solid var(--orange);background:#14171a;margin:10px 14px;padding:10px 14px;color:#dfe3e7;font-size:12px;line-height:1.9}
.sentence b{color:#ffb12d;font-weight:600}
.sentence i{color:#78aefb;font-style:normal}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 14px}
.diff-col{border:1px solid #2a3034;border-radius:4px}
.diff-col h3{margin:0;padding:9px 12px;font-size:11px;border-bottom:1px solid #2a3034}
.diff-col ul{margin:0;padding:8px 12px 10px 26px;max-height:240px;overflow:auto;font-size:11px;line-height:1.9;color:#c5cacf}
.diff-col li small{color:#858c93;display:block}
.statusbar2{position:fixed;bottom:0;left:0;right:0;height:30px;background:#0c0e0f;border-top:2px solid var(--orange);display:flex;align-items:center;gap:24px;padding:0 20px;color:var(--green);font-size:10px;z-index:9}
.statusbar2 .fr{margin-left:auto;color:#81878d}
.kv .row2{display:flex;justify-content:space-between;gap:14px;padding:9px 14px;border-bottom:1px solid #252a2d;color:#9aa2a9;font-size:11px}
.kv .row2 b{color:#e2e6e9;font-weight:600;font-family:"DM Mono",monospace}
.kv .row2:last-child{border-bottom:0}
.ik-chart{width:100%;height:190px;display:block}
.plan-cards{padding:10px 12px;display:grid;gap:10px}
.plan-card{border:1px solid #33383c;border-radius:4px;background:#151719;padding:12px 14px}
.plan-card .head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.plan-card .grid2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.plan-card .grid2>div{display:grid;gap:3px;color:#858c93;font-size:10px}
.plan-card .grid2 b{color:#e5e8eb;font-size:12px;font-family:"DM Mono",monospace}
.chat-log{min-height:420px;max-height:56vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:9px;max-width:92%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.avatar2{width:26px;height:26px;border-radius:4px;display:grid;place-items:center;flex-shrink:0;font-size:11px;font-weight:700}
.msg.ai .avatar2{background:#2b2112;color:#ffb12d}
.msg.user .avatar2{background:#17283a;color:#8fc0ff}
.bubble2{border:1px solid #2e3438;background:#14181a;border-radius:5px;padding:10px 12px;font-size:12px;line-height:1.75;color:#e3e7ea;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.msg.user .bubble2{background:#17222c;border-color:#2b4257}
.quick-row{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid #252a2d}
.chat-in{border-top:1px solid #2a2f33;padding:12px;display:flex;gap:9px}
.chat-in input{flex:1;min-width:0;background:#0c0e0f;border:1px solid #343a3e;border-radius:4px;padding:9px 12px;color:#e7e9ec;font-size:12px;outline:0}
.chat-in input:focus{border-color:#9a6218}
@media(max-width:1100px){.stat-grid{grid-template-columns:repeat(2,1fr)}.cond{grid-template-columns:1fr 60px 80px;flex-wrap:wrap}.cond .hint{grid-column:1/-1}.diff-grid{grid-template-columns:1fr}.plan-card .grid2{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div class="brand"><span>STARGAZER</span><small>完整版 · RULES DESK</small></div>
  <nav class="main-nav" id="mainNav">
    <button data-p="overview" class="active">总览</button>
    <button data-p="plan">交易计划</button>
    <button data-p="monitor">盘中监控</button>
    <button data-p="positions">持仓</button>
    <button data-p="watch">观察名单</button>
    <button data-p="strategy">策略规则</button>
    <button data-p="review">复盘 · 研究</button>
    <button data-p="assistant">Stargazer 助手</button>
    <button data-p="corvus">Corvus 信息</button>
  </nav>
  <div class="top-status">
    <span class="top-muted" id="topDataDay">数据日：读取中…</span>
    <span class="top-muted" id="topSnap">快照：—</span>
    <b id="topCheck">—</b>
  </div>
</header>
<main class="main-content" id="view"><div class="empty">正在从后端读取…</div></main>
<footer class="statusbar2">
  <span><i class="live-dot"></i>后端：Flask 同源 /api</span>
  <span>模拟环境：提醒进本地收件箱，可配钉钉/Pushplus 推送</span>
  <span>未接通功能标「待接入」，不会假报成功</span>
  <span class="fr">STARGAZER 完整版 · 规则 / 研究 / 数据闭环</span>
</footer>
</div>
<div id="modalRoot"></div>

<script>
const $=s=>document.querySelector(s);
const V=$('#view');
let UI={}, RULE=null, CURRENT_REF=null, TAROT=false, STATE={};
function recentDaysStr(n){ const d=(STATE.recent_days||[]).slice(-n); return d.join(','); }
function latestLvp(pubs){
  const vs=pubs.filter(x=>x.startsWith('lvp_golden@')).sort();
  return vs.length?vs[vs.length-1]:null;
}
function defaultRef(pubs){ return (CURRENT_REF&&pubs.includes(CURRENT_REF))?CURRENT_REF:(latestLvp(pubs)||pubs[0]); }

async function api(p, body){
  const r=await fetch(p, body!==undefined?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);
  return r.json();
}
function toast(msg, bad){
  const t=document.createElement('div');
  t.className='toast';
  if(bad){t.style.background='#2b1515';t.style.borderColor='#6b2928';t.style.color='#ff9f9a';}
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 4200);
}
function pct(x){return x==null?'—':(x*100).toFixed(2)+'%';}
function fmtTs(t){return t?String(t).replace(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2}).*$/,'$2-$3 $4:$5'):'—';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function go(p){const b=document.querySelector(`#mainNav button[data-p="${p}"]`); if(b) b.click();}
function pageShell(title, sub, inner){
  V.innerHTML=`<div class="page-heading"><div><div class="eyebrow">STARGAZER FULL EDITION</div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="heading-actions"></div></div>${inner}`;
}
function panel(title, body, extra){
  return `<section class="panel"><div class="section-title"><span>${title}</span>${extra||''}</div>${body}</section>`;
}
const spacing='<div style="height:12px"></div>';
function modal(title, bodyHtml, footHtml){
  $('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="closeModal()">
    <div class="modal" style="width:min(680px,calc(100vw - 30px))" onclick="event.stopPropagation()">
      <div class="modal-head"><strong>${title}</strong><button class="icon-btn" onclick="closeModal()">✕</button></div>
      ${bodyHtml}${footHtml?`<div class="modal-actions">${footHtml}</div>`:''}
    </div></div>`;
}
function closeModal(){$('#modalRoot').innerHTML='';}

/* ================= 指数 K 线（SVG：价格轴/网格/日期轴/黄金位线/悬停） ================= */
const KSYM_LABEL={SSE:'沪指',SZSE:'深证成指',CYB:'创业板指'};
let K_PERIOD='1d', INDEX_MAPS=null;
async function getIndexMaps(){
  if(!INDEX_MAPS) INDEX_MAPS=await api('/api/prod/index_maps').catch(()=>({ok:false}));
  return INDEX_MAPS;
}
function drawKline(el, bars, golden){
  if(!bars||!bars.length){el.innerHTML='<div class="empty compact">后端未返回 K 线数据（不拼造）</div>';return;}
  const CW=640,AH=64,DH=18,H=190,pad=8,ibH=26;
  const W=CW+AH;
  const vals=bars.flatMap(b=>[b.high,b.low]).filter(Number.isFinite);
  let hi=Math.max(...vals), lo=Math.min(...vals);
  const padV=(hi-lo)*0.06||1; hi+=padV; lo-=padV;
  const span=hi-lo||1;
  const step=(CW-pad*2)/bars.length, bw=Math.max(1,Math.min(step*0.62,9));
  const y=v=>pad+(hi-v)/span*(H-pad*2-8);
  const fmtP=v=>v>=1000?v.toFixed(2):v.toFixed(2);
  let s='';
  // 网格 + 右侧价格轴
  const ticks=5;
  for(let t=0;t<=ticks;t++){
    const pv=hi-span*t/ticks, yy=y(pv);
    s+=`<line x1="${pad}" x2="${CW-pad}" y1="${yy}" y2="${yy}" stroke="#1f2428" stroke-width="0.6"/>`;
    s+=`<text x="${CW+4}" y="${yy+3}" font-size="9" fill="#687078" font-family="DM Mono,monospace">${fmtP(pv)}</text>`;
  }
  // 黄金位线（生产版指数地图归档，只读）
  if(golden){
    const gl=[['upper',golden.upper],['lower',golden.lower],['following',golden.following]];
    for(const [k,v] of gl){
      if(v==null||v<lo||v>hi) continue;
      const yy=y(v);
      s+=`<line x1="${pad}" x2="${CW-pad}" y1="${yy}" y2="${yy}" stroke="#ff9d19" stroke-width="1" opacity="0.9"/>`;
      s+=`<text x="${CW-2}" y="${yy-2}" font-size="9" fill="#ffb12d" text-anchor="end" font-family="DM Mono,monospace">${v}</text>`;
    }
  }
  // K 线
  for(let i=0;i<bars.length;i++){
    const b=bars[i], x=pad+i*step+step/2, up=b.close>=b.open, c=up?'#e2695f':'#4aa889';
    const top=y(Math.max(b.open,b.close)), bot=y(Math.min(b.open,b.close));
    s+=`<line x1="${x}" x2="${x}" y1="${y(b.high)}" y2="${y(b.low)}" stroke="${c}" stroke-width="1"/>`;
    s+=`<rect x="${x-bw/2}" y="${top}" width="${bw}" height="${Math.max(1,bot-top)}" fill="${up?'none':c}" stroke="${c}" stroke-width="1"/>`;
  }
  // 底部日期轴（均布 5 个）
  const nD=Math.min(5,bars.length);
  for(let t=0;t<nD;t++){
    const i=Math.round(t*(bars.length-1)/(nD-1||1));
    const x=pad+i*step+step/2;
    s+=`<text x="${x}" y="${H-4}" font-size="9" fill="#687078" text-anchor="middle" font-family="DM Mono,monospace">${String(bars[i].ts).slice(0,4)}-${String(bars[i].ts).slice(4,6)}-${String(bars[i].ts).slice(6,8)}</text>`;
  }
  // 悬停十字光标
  s+=`<line id="kxCross" x1="0" x2="0" y1="${pad}" y2="${H-8}" stroke="#ffb12d" stroke-width="0.6" stroke-dasharray="3,3" visibility="hidden"/>`;
  el.innerHTML=`<div style="position:relative">
    <svg class="ik-chart" id="ikSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="指数 K 线（本地通达信）" style="cursor:crosshair">${s}
    <rect id="ikHover" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>
    <div id="ikInfo" style="height:${ibH}px;font-size:10px;color:#9aa2a9;font-family:'DM Mono',monospace;padding:4px 2px"></div>
  </div>`;
  const svg=el.querySelector('#ikSvg'), cross=el.querySelector('#kxCross'), info=el.querySelector('#ikInfo');
  const showBar=i=>{
    const b=bars[i]; if(!b) return;
    const x=pad+i*step+step/2;
    cross.setAttribute('x1',x); cross.setAttribute('x2',x); cross.setAttribute('visibility','visible');
    const prev=bars[i-1], chg=prev?((b.close/prev.close-1)*100):null;
    info.innerHTML=`<b style="color:#e2e6e9">${b.ts}</b> 开 ${b.open} 高 ${b.high} 低 ${b.low} 收 <b style="color:${chg==null?'#e2e6e9':(chg>=0?'#ff554d':'#22c78b')}">${b.close}${chg!=null?(' '+chg.toFixed(2)+'%'):''}</b> 量 ${(b.volume/1e8).toFixed(1)} 亿`;
  };
  showBar(bars.length-1);
  svg.addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(bars.length-1,Math.floor((px-pad)/step)));
    showBar(i);
  });
  svg.addEventListener('mouseleave',()=>{cross.setAttribute('visibility','hidden');showBar(bars.length-1);});
}
async function loadKline(symbol){
  const el=$('#klineBox'); if(!el) return;
  if(K_PERIOD==='5m'){el.innerHTML='<div class="empty compact">五分钟 K：本地通达信归档不含指数 5 分钟数据，完整版不伪造；生产版该页签读取实时行情源。</div>';const n=$('#klineNote');if(n)n.textContent='';return;}
  el.innerHTML='<div class="empty compact">读取本地 K 线…</div>';
  const r=await api('/api/index_kline?symbol='+symbol);
  if(!r.ok){el.innerHTML=`<div class="error-view"><b>K 线读取失败</b><span>${esc(r.error)}</span></div>`;return;}
  const maps=await getIndexMaps();
  const key={SSE:'sse',SZSE:'szse',CYB:'cyb'}[symbol];
  const golden=maps.ok?(maps.maps.find(m=>m.symbol===key)||{}):null;
  drawKline(el, r.bars, golden&&golden.upper!=null?golden:null);
  const n=$('#klineNote');
  if(n) n.textContent=`来源：sh999999.day（本地通达信） · 最后完整 K 线 ${r.last_complete_ts}${r.dropped_records?(' · 剔除历史不一致记录 '+r.dropped_records+' 条'):''}${maps.ok?(' · 黄金位线：生产版指数地图归档 '+String(maps.requested_day||'')):' · 指数地图归档未找到，未画黄金位线'}`;
}

/* ================= 总览 ================= */
async function pageOverview(){
  const st=await api('/api/state'); STATE=st;
  $('#topDataDay').textContent='数据日：'+(st.data_through||'—');
  $('#topSnap').textContent='快照：'+(st.snapshot_fingerprint||'—');
  const lr=await api('/api/last_run').catch(()=>({error:'NO_RUN'}));
  const tc=$('#topCheck');
  if(tc) tc.textContent=lr.error?'尚无运行':('最近运行 '+(lr.run_id||'—'));
  const sw=st.model_switch||{};
  const src=st.source||{source:'tdx'};
  const srcLabel=src.source==='tdx'?'本地通达信':'StockDB';
  const srcPath=src.source==='tdx'?(src.tdx_path||''):(src.stockdb_base||'');
  pageShell('总览','',
  `<div class="stat-grid">
    <div class="stat-card"><div class="stat-sub">数据更新至</div><div class="stat-value green">${st.data_through||'—'}</div><div class="stat-sub">日历至 ${st.calendar_through||'—'}</div></div>
    <div class="stat-card"><div class="stat-sub">选股日 P / 监控日 D</div><div class="stat-value">${st.p_day||'—'}<small style="font-size:11px;color:#858c93"> / ${st.monitor_day||'—'}</small></div><div class="stat-sub">分钟历史 ${st.minute_days||0} 天</div></div>
    <div class="stat-card"><div class="stat-sub">最近运行</div><div class="stat-value orange">${lr.error?'—':(lr.touches??0)}<small style="font-size:11px;color:#858c93"> 次触位</small></div><div class="stat-sub">${lr.error?'尚未运行':'回执 '+(lr.inbox?Object.values(lr.inbox).reduce((a,b)=>a+b,0):0)+' 条'}</div></div>
    <div class="stat-card"><div class="stat-sub">选股模型</div><div class="stat-value ${sw.selection?'green':''}" style="font-size:16px">${sw.selection?'开启':'关闭 · 纯规则'}</div><div class="stat-sub">风险模型 ${sw.risk?'开':'关'}</div></div>
    <div class="stat-card"><div class="stat-sub">数据源</div><div class="stat-value" style="font-size:16px">${srcLabel}</div><div class="stat-sub cell-wrap">${esc(srcPath)||'未配置'}</div></div>
  </div>
  ${panel('指数 K 线',`
    <div class="button-row" style="padding:12px">
      <button class="mini-primary" data-sym="SSE" onclick="klineTab('SSE')">沪指</button>
      <button class="mini-outline" data-sym="SZSE" onclick="klineTab('SZSE')">深证成指</button>
      <button class="mini-outline" data-sym="CYB" onclick="klineTab('CYB')">创业板指</button>
      <span style="width:8px"></span>
      <button class="mini-primary" data-per="1d" onclick="klinePeriod('1d')">日 K</button>
      <button class="mini-outline" data-per="5m" onclick="klinePeriod('5m')">五分钟 K</button>
      <span style="flex:1"></span>
      <button class="outline-btn" onclick="loadKline(KSYM)" id="klineRefresh">读取行情源</button>
    </div>
    <div id="klineBox"></div>
    <div class="panel-note" id="klineNote"></div>`)}
  ${spacing}
  <div class="overview-grid">
    ${panel('Corvus 近期快讯','<div class="empty compact">生产版在线采集（财联社等），本地无归档；完整版不虚构新闻内容。全球市场快照见「Corvus 信息」页（生产版归档只读）。</div>')}
    <div id="riskPanel"></div>
  </div>
  ${spacing}
  ${panel('最近运行', lr.error
      ? `<div class="empty compact">尚未运行：到「盘后选股」发起第一次全流程。</div>`
      : `<div class="kv">
          <div class="row2"><span>运行 ID</span><b>${lr.run_id}</b></div>
          <div class="row2"><span>筛中 / 冻结 / 触位</span><b>${lr.selected_n??'—'} / ${lr.frozen_n??'—'} / ${lr.touches??0}</b></div>
          <div class="row2"><span>收件箱回执</span><b>${lr.inbox?JSON.stringify(lr.inbox):'—'}</b></div>
          <div class="row2"><span>未冻结（缺盘前参考价等）</span><b>${(lr.not_frozen||[]).length} 只</b></div>
        </div>`)}
  ${spacing}
  <div class="overview-grid">
    ${panel('模型开关（关闭 = 直走规则层）',`<div class="model-status">
        <div><label class="check-label"><input type="checkbox" id="swSelection" ${sw.selection?'checked':''}> 选股模型（Tarot 影子评分）</label><i class="status-led ${sw.selection?'':'gray'}"></i><span>${sw.selection?'参与运行':'关闭'}</span></div>
        <div><label class="check-label"><input type="checkbox" id="swRisk" ${sw.risk?'checked':''}> 风险模型</label><i class="status-led gray"></i><span>未接入，先记录状态</span></div>
      </div>
      <div class="button-row" style="padding:0 16px 14px"><button class="primary-btn small" onclick="saveSwitch()">保存开关</button><span class="tiny muted" id="swNote">Tarot 状态载入中…</span></div>`)}
    ${panel('数据源与推送',`<div class="context-list">
        <span>当前数据源 <b>${srcLabel}</b></span>
        <span>路径 <b class="cell-wrap">${esc(srcPath)||'未配置'}</b></span>
        <span>推送渠道 <b id="pushChannelView2">读取中…</b></span>
      </div>
      <div class="button-row" style="padding:0 14px 14px">
        <button class="outline-btn" onclick="openDataModal()">数据来源 / 更新数据</button>
        <button class="outline-btn" onclick="openPushModal()">推送配置</button>
      </div>`)}
  </div>
  `);
  loadKline('SSE');
  loadPushView();
  loadRiskPanel();
  const ts=await api('/api/tarot_status').catch(()=>null);
  const n=$('#swNote'); if(n&&ts) n.textContent=ts.available?'Tarot 可用（本地冻结权重）':'Tarot 不可用（'+(!ts.repo_ok?'缺主仓库权重':'缺依赖')+'）';
}
function klineTab(sym){
  KSYM=sym;
  document.querySelectorAll('[data-sym]').forEach(b=>{b.className=b.dataset.sym===sym?'mini-primary':'mini-outline';});
  loadKline(sym);
}
function klinePeriod(p){
  K_PERIOD=p;
  document.querySelectorAll('[data-per]').forEach(b=>{b.className=b.dataset.per===p?'mini-primary':'mini-outline';});
  loadKline(KSYM);
}
let KSYM='SSE';
async function loadRiskPanel(){
  const el=$('#riskPanel'); if(!el) return;
  const maps=await getIndexMaps();

function fieldOptions(sec, sel){
  const order=['日K选股','黄金观察区','量比与换手','5分钟监控','15分钟监控','30分钟监控'];
  const cats={};
  for(const [k,v] of Object.entries(UI)){
    const selOk = sec==='selection' ? v.category==='日K选股' : v.category!=='日K选股';
    if(!selOk) continue;
    (cats[v.category]=cats[v.category]||[]).push([k,v]);
  }
  const keys=Object.keys(cats).sort((a,b)=>(order.indexOf(a)<0?99:order.indexOf(a))-(order.indexOf(b)<0?99:order.indexOf(b)));
  return keys.map(cat=>`<optgroup label="── ${cat} ──">${cats[cat].map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(v.label||k)}</option>`).join('')}</optgroup>`).join('');
}
function condRow(sec, c){
  const div=document.createElement('div'); div.className='cond';
  const m=c.field?(UI[c.field]||{}):{};
  div.innerHTML=`<select class="f">${fieldOptions(sec,c.field)}</select>
    <select class="o">${['>=','<=','>','<','==','!='].map(o=>`<option ${o===c.op?'selected':''}>${o}</option>`).join('')}</select>
    <input class="v" value="${c.value??''}" placeholder="阈值">
    <span class="unit">${m.unit||''}</span>
    <span class="hint">${m.period||''}${m.window?(' · 需 '+m.window+' 数据'):''}${m.hint?(' · '+m.hint):''}</span>
    <button class="icon-btn del" title="删除条件">✕</button>`;
  div.querySelector('.f').onchange=e=>{
    const mm=UI[e.target.value]||{};
    div.querySelector('.unit').textContent=mm.unit||'';
    div.querySelector('.hint').textContent=(mm.period||'')+(mm.window?(' · 需 '+mm.window+' 数据'):'')+(mm.hint?(' · '+mm.hint):'');
    renderSentence();
  };
  div.querySelector('.o').onchange=renderSentence;
  div.querySelector('.v').oninput=renderSentence;
  div.querySelector('.del').onclick=()=>{div.remove();renderSentence();};
  return div;
}
function collect(sec){
  const root=$(sec==='selection'?'#selConds':'#trigConds');
  const children=[...root.querySelectorAll('.cond')].map(d=>({field:d.querySelector('.f').value,op:d.querySelector('.o').value,value:Number(d.querySelector('.v').value)}));
  return {op:$(sec==='selection'?'#selLogic':'#trigLogic').value==='all'?'AND':'OR', children};
}
function sentenceOf(sec){
  const c=collect(sec);
  if(!c.children.length) return '（还没有条件，点「+ 加条件」）';
  const j=c.op==='AND'?' <i>且</i> ':' <i>或</i> ';
  return c.children.map(x=>{const m=UI[x.field]||{};return `<b>${esc(m.label||x.field)}</b> ${x.op} <b>${x.value}</b>${m.unit?(' '+m.unit):''}`;}).join(j);
}
function renderSentence(){
  const s1=$('#selSentence'), s2=$('#trigSentence');
  if(s1) s1.innerHTML='盘后筛选（P 日收盘后）：'+sentenceOf('selection');
  if(s2) s2.innerHTML='盘中触发（D 日逐根 5 分钟）：'+sentenceOf('trigger');
}
function draftRule(){
  const r=JSON.parse(JSON.stringify(RULE));
  r.selection=collect('selection'); r.trigger=collect('trigger');
  r.notification=r.notification||{};
  const attach=[...$('#trigConds').querySelectorAll('.cond')].filter(d=>d.querySelector('.a')&&d.querySelector('.a').checked).map(d=>d.querySelector('.f').value);
  if(attach.length) r.notification.attach_fields=attach; else delete r.notification.attach_fields;
  let name=($('#draftName')?$('#draftName').value:'').trim();
  if(!name) name=RULE.rule_id+'_draft';
  if(!/^[a-zA-Z][a-zA-Z0-9_]{1,40}$/.test(name)) name=name.replace(/[^a-zA-Z0-9_]/g,'_').replace(/^[^a-zA-Z]+/,'')||'my_rule';
  r.rule_id=name;
  return r;
}

function pickFactor(){

async function doBacktest(){
  $('#btState').textContent='回测中…';
  const r=await api('/api/backtest/run',{});
  const out=$('#btOut');
  if(!r.ok){out.innerHTML=`<div class="error-view"><b>回测失败</b><span>${esc(JSON.stringify(r).slice(0,300))}</span></div>`;$('#btState').textContent='失败';return;}
  const s=r.summary;
  let hold='';
  for(const k of ['1','3','5']){
    const h=s['hold_'+k+'d'];
    hold+=h
      ?`<div class="row2"><span>持仓 ${k} 日</span><b>可结算 ${h.n} 笔 · 胜率 ${(h.win*100).toFixed(0)}% · 价格表现 ${pct(h.mean_ret)} · 含成本 ${pct(h.mean_pnl)}</b></div>`
      :`<div class="row2"><span>持仓 ${k} 日</span><b class="muted">窗口数据不足（导入新数据后重跑）</b></div>`;
  }
  const nr=s.no_fill_reasons||{};
  const eq=s.equity_curve||[];
  const eqHtml=eq.length
    ? `<div class="table-wrap" style="padding:0 14px 12px"><table><tr><th>时间</th><th>累计（${s.equity_key}）</th></tr>${eq.filter((_,i)=>i%Math.max(1,Math.floor(eq.length/20))===0||i===eq.length-1).map(p=>`<tr><td>${fmtTs(p.ts)}</td><td>${pct(p.cum_pnl)}</td></tr>`).join('')}</table></div>`
    : `<div class="panel-note">资金曲线：暂无可结算样本（T+1 出场需要次日数据）。</div>`;
  const rowsHtml=`<div class="table-wrap" style="padding:0 14px 12px"><table><tr><th>代码</th><th>入场时间</th><th>入场价</th><th>1日价格</th><th>1日盈亏</th></tr>${(r.rows||[]).filter(x=>x.status==='FILLED').slice(0,20).map(x=>`<tr><td><b>${x.code}</b></td><td>${fmtTs(x.entry_ts)}</td><td>${x.entry}</td><td>${pct(x.ret_1d)}</td><td>${pct(x.pnl_1d)}</td></tr>`).join('')}</table></div>`;
  out.innerHTML=`<div class="kv">
    <div class="row2"><span>信号 / 成交 / 未成交</span><b>${s.signals} / ${s.filled} / ${s.no_fill}</b></div>
    ${s.no_fill?`<div class="row2"><span>未成交原因</span><b>${Object.entries(nr).map(([k,v])=>({SUSPENDED_OR_ONE_PRICE_BAR:'停牌/一字',NEAR_LIMIT_DOWN:'临近跌停'}[k]||k)+' '+v).join(' · ')}</b></div>`:''}
    ${hold}
    <div class="row2"><span>成本口径</span><b>佣金 0.025% + 双边滑点 0.1%${s.cost_basis&&s.cost_basis.stamp_tax?' + 盈利印花税 0.05%':''}；${esc(s.t_plus_1||'')}</b></div>
  </div>${eqHtml}${rowsHtml}`;
  $('#btState').textContent='完成';
}
async function doFactorLibrary(){

}
async function doMine(){
  $('#mineState').textContent='挖掘中（约 1 分钟）…';
  const days=$('#mineDays').value.split(',').map(x=>+x.trim()).filter(Boolean);
  const r=await api('/api/research/mine',{days,purge:+$('#minePurge').value||1});
  const out=$('#mineOut');
  if(!r.ok){out.innerHTML=`<div class="error-view"><b>挖掘失败</b><span>${esc(JSON.stringify(r).slice(0,300))}</span></div>`;$('#mineState').textContent='失败';return;}
  const foldRows=(r.folds||[]).map(f=>f.skipped
    ?`<tr><td>${f.test_day}</td><td colspan="4" class="muted">跳过：${esc(f.skipped)}</td></tr>`
    :`<tr><td>${f.test_day}</td><td class="cell-wrap">${f.factors.join(' + ')}</td><td>${f.train_ic}</td><td><b class="${f.test_ic>0?'green':'red'}">${f.test_ic}</b></td><td>${(f.train_days||[]).length} 个训练日</td></tr>`).join('');
  const candRows=(r.candidates||[]).map(c=>`<tr><td class="cell-wrap">${c.factors.join(' + ')}</td><td>${c.folds_n}</td><td>${c.mean_ic}</td><td>${c.pos_ratio}</td><td><span class="pill ${c.promotable?'green':'orange'}">${c.promotable?'可晋级':'pending'}</span></td></tr>`).join('');
  out.innerHTML=`<div class="section-title" style="margin-top:10px"><span>逐折结果</span></div>
    <div class="table-wrap"><table><tr><th>测试日</th><th>因子组合</th><th>训练 IC</th><th>样本外 IC</th><th>训练窗</th></tr>${foldRows||'<tr><td colspan="5" class="muted">无</td></tr>'}</table></div>
    <div class="section-title" style="margin-top:10px"><span>候选库</span></div>
    <div class="table-wrap"><table><tr><th>因子组合</th><th>折数</th><th>均值 IC</th><th>正 IC 占比</th><th>状态</th></tr>${candRows||'<tr><td colspan="5" class="muted">无候选</td></tr>'}</table></div>`;
  $('#mineState').textContent='完成';
}
async function doFactor(){
  const out=$('#factorOut');
  out.innerHTML='<div class="empty compact">计算中…</div>';
  const days=$('#factorP').value.split(',').map(x=>+x.trim()).filter(Boolean);
  const r=await api('/api/research/evaluate',{expr:$('#factorExpr').value,days});
  if(r.error){out.innerHTML=`<div class="error-view"><b>评估失败</b><span>${esc(r.error)}</span></div>`;return;}

    const ic=d.ic!=null?d.ic:(d.summary&&d.summary.ic);
    return `<tr><td>${d.p_day||d.day||''}</td><td>${d.n??d.coverage_n??'—'}</td><td><b class="${(ic??0)>0?'green':'red'}">${ic!=null?+ic.toFixed(4):'待核验'}</b></td><td class="cell-wrap">${d.note?esc(d.note):(d.missing_n?('缺失 '+d.missing_n):'')}</td></tr>`;
  }).join('');
  out.innerHTML=`<div class="kv">
      <div class="row2"><span>因子公式</span><b>${esc($('#factorExpr').value)}</b></div>
      <div class="row2"><span>多日汇总</span><b>${sm.ic!=null?('IC '+sm.ic):esc(JSON.stringify(sm).slice(0,120))}</b></div>
    </div>
    <div class="table-wrap"><table><tr><th>P 日</th><th>样本</th><th>IC</th><th>备注</th></tr>${dayRows||'<tr><td colspan="4" class="muted">无结果</td></tr>'}</table></div>`;
}

async function pageAssistant(){
  pageShell('Stargazer 助手','',
  `<div class="assistant-layout">
    <div class="sg-side">
      ${panel('快捷指令 <span class="pill" style="margin-left:6px">仅填入输入框</span>',`<div class="sg-quick">
        ${QUICK_CMDS.map(q=>`<button class="sg-quick-btn" onclick="fillAsk('${q}')">&gt;_ ${q}</button>`).join('')}
      </div>
      <div class="sidebar-note">指令只是对话文本，由本地知识库识别意图回答；不预设股票代码，也不返回模拟回复。</div>`)}
      ${panel('推送通知','<div id="pushNotify"><div class="empty compact">读取中…</div></div>')}
    </div>
    ${panel('对话 <span class="pill green" style="margin-left:6px">真实后端</span>',`<div class="chat-log" id="chatLog">
      <div class="msg ai"><div class="avatar2">SG</div><div class="bubble2">你好，我是 Stargazer 助手。左侧点快捷指令会填入输入框，回车或点发送提问；推送通知在左下查看。</div></div>
    </div>
    <div class="chat-in"><input id="chatInput" placeholder="输入问题，回车发送" onkeydown="if(event.key==='Enter')ask()"><button class="primary-btn small" onclick="ask()">发送</button></div>`)}
  </div>`);
  loadPushNotify();
}
function fillAsk(q){const i=$('#chatInput'); if(i){i.value=q;i.focus();}}
let notifyOpen=false;
async function loadPushNotify(){
  const el=$('#pushNotify'); if(!el) return;
  const r=await api('/api/push/log');
  const ns=r.notifications||[];
  el.innerHTML=`<button class="sg-expand-btn" onclick="notifyOpen=!notifyOpen;loadPushNotify()">${notifyOpen?'▾':'▸'} 查看通知（${ns.length} 条）</button>
    ${notifyOpen?`<div class="sg-events">${ns.slice(0,20).map(n=>`<div class="sg-event-row"><time>${esc(String(n.sent_at||'').slice(5,16))}</time><b>${esc(n.title||'')}</b><span>${esc(n.channel||'')} ${n.ok?'<span class="pill green">成功</span>':'<span class="pill red">失败</span>'} ${esc(n.error||'')}</span></div>`).join('')||'<div class="empty compact">暂无通知</div>'}</div>`:''}
    <div class="tiny muted" style="padding:6px 14px">运行触位汇总、推送测试都会记录在此；渠道在总览「推送配置」。</div>`;
}
async function ask(preset){
  const inp=$('#chatInput');
  const q=(preset||(inp&&inp.value)||'').trim();
  if(!q) return;
  if(inp) inp.value='';
  const log=$('#chatLog');
  log.insertAdjacentHTML('beforeend',`<div class="msg user"><div class="avatar2">我</div><div class="bubble2">${esc(q)}</div></div>`);
  log.insertAdjacentHTML('beforeend',`<div class="msg ai" id="pendingMsg"><div class="avatar2">SG</div><div class="bubble2" style="color:#9aa2a9">思考中…</div></div>`);
  log.scrollTop=log.scrollHeight;
  const r=await api('/api/assistant/chat',{q});
  const pm=$('#pendingMsg');
  if(pm) pm.remove();
  log.insertAdjacentHTML('beforeend',`<div class="msg ai"><div class="avatar2">SG</div><div class="bubble2">${esc(r.reply||'（无回答）')}${r.topic?`<div style="margin-top:7px;color:#858c93;font-size:10px">主题：${esc(r.topic)}</div>`:''}</div></div>`);
  log.scrollTop=log.scrollHeight;
}

    ${items.map(x=>`<tr>
      <td><b>${x.code}</b><small>${esc(x.name||'')}</small></td>
      <td>${x.latest_close??'—'}</td>
      <td class="${(x.change_pct??0)>=0?'up':'down'}">${x.change_pct!=null?x.change_pct.toFixed(2)+'%':'—'}</td>

    </tr>`).join('')||'<tr><td colspan="8"><div class="empty compact">观察名单为空</div></td></tr>'}</table></div>
    <div class="panel-note">删除只移除观察条目；与持仓、正式计划互不干涉。刷新与重启从 watch.json 读回。</div>`);
}
async function openWatchEdit(code){
  const cur=code?(await api('/api/watch')).items.find(x=>x.code===code):null;
  modal(code?('编辑观察条目 '+code):'加入观察',`
    <div class="form-grid">
      <label>股票代码<input id="wCode" value="${cur?cur.code:''}" ${cur?'disabled':''} placeholder="6 位代码"></label>
      <label>名称<input id="wName" value="${cur?esc(cur.name||''):''}"></label>
      <label>目标买入价<input id="wTarget" value="${cur&&cur.target_buy!=null?cur.target_buy:''}"></label>
      <label>止损价<input id="wStop" value="${cur&&cur.stop_loss!=null?cur.stop_loss:''}"></label>
      <label>策略<input id="wStrategy" value="${cur?esc(cur.strategy||''):''}"></label>
      <label>理由<input id="wReason" value="${cur?esc(cur.reason||''):''}"></label>
    </div>`,
    `<button class="outline-btn" onclick="closeModal()">取消</button><button class="primary-btn small" onclick="saveWatch()">保存</button>`);
}
async function saveWatch(){
  const code=$('#wCode').value.trim();
  const num=v=>{const n=Number(v);return v.trim()===''||!isFinite(n)?null:n;};
  const r=await api('/api/watch',{code,name:$('#wName').value,target_buy:num($('#wTarget').value),stop_loss:num($('#wStop').value),strategy:$('#wStrategy').value,reason:$('#wReason').value});
  if(!r.ok){toast('保存失败：'+r.error,true);return;}
  toast('已保存观察条目 '+r.saved);
  closeModal(); pageWatch();
}
async function delWatch(code){
  if(!confirm('删除观察条目 '+code+'？')) return;
  const resp=await fetch('/api/watch?code='+encodeURIComponent(code),{method:'DELETE'}).then(x=>x.json());
  toast(resp.ok?('已删除 '+code):'删除失败');
  pageWatch();
}
